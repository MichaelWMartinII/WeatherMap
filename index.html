<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>WeatherMap</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Map fills entire viewport -->
  <div id="map"></div>

  <!-- Top bar controls -->
  <div id="top-bar">
    <button id="btn-menu" aria-label="Menu">&#9776;</button>
    <div id="top-bar-title">WeatherMap</div>
    <div id="top-bar-actions">
      <button id="btn-radar" aria-label="Toggle radar" title="Weather radar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="6"/>
          <circle cx="12" cy="12" r="2"/>
          <line x1="12" y1="2" x2="12" y2="6"/>
        </svg>
      </button>
      <button id="btn-locate" aria-label="My location" title="My location">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <line x1="12" y1="2" x2="12" y2="6"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="6" y2="12"/>
          <line x1="18" y1="12" x2="22" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Radar controls overlay -->
  <div id="radar-controls" class="hidden">
    <button id="radar-play-pause" aria-label="Play/Pause">&#9654;</button>
    <input id="radar-slider" type="range" min="0" max="0" value="0">
    <span id="radar-time"></span>
  </div>

  <!-- Bottom sheet -->
  <div id="bottom-sheet">
    <div id="sheet-handle"><div id="sheet-handle-bar"></div></div>

    <div id="sheet-content">
      <!-- Search section -->
      <div id="search-section">
        <div class="search-field">
          <label for="input-from">From</label>
          <input id="input-from" type="text" placeholder="Current location" autocomplete="off">
          <button class="clear-btn hidden" data-target="input-from">&times;</button>
        </div>
        <div class="search-field">
          <label for="input-to">To</label>
          <input id="input-to" type="text" placeholder="Search destination" autocomplete="off">
          <button class="clear-btn hidden" data-target="input-to">&times;</button>
        </div>
        <div id="search-results" class="hidden"></div>
      </div>

      <!-- Route info panel -->
      <div id="route-panel" class="hidden">
        <div id="route-summary">
          <div id="route-eta"></div>
          <div id="route-distance"></div>
        </div>
        <div id="weather-delta"></div>

        <!-- Departure time -->
        <div id="departure-section">
          <label for="departure-time">Depart at:</label>
          <input id="departure-time" type="datetime-local">
          <button id="btn-depart-now">Now</button>
        </div>

        <!-- Weather timeline strip -->
        <div id="weather-timeline"></div>

        <!-- Turn-by-turn directions -->
        <div id="directions-list"></div>

        <div id="nav-buttons">
          <button id="btn-start-nav">Start</button>
          <button id="btn-clear-route">Clear route</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Side menu -->
  <div id="menu-overlay" class="hidden"></div>
  <div id="side-menu" class="closed">
    <div id="menu-header">
      <span id="menu-title">Settings</span>
      <button id="btn-menu-close" aria-label="Close menu">&times;</button>
    </div>
    <div id="menu-body">
      <div class="menu-section">
        <div class="menu-section-label">Set Location Manually</div>
        <div class="menu-row">
          <input id="menu-location-input" type="text" placeholder="City, address, or zip code" autocomplete="off">
          <button id="btn-set-location">Set</button>
        </div>
      </div>
      <div class="menu-section">
        <div class="menu-section-label">Units</div>
        <div class="menu-row">
          <button id="btn-unit-mi" class="unit-btn active">Miles</button>
          <button id="btn-unit-km" class="unit-btn">Kilometers</button>
        </div>
      </div>
      <div class="menu-section">
        <div class="menu-section-label">App</div>
        <button id="btn-clear-cache" class="menu-action-btn">Clear Cache &amp; Reload</button>
      </div>
      <div id="menu-footer">WeatherMap v1.0</div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/map.js"></script>
  <script src="js/search.js"></script>
  <script src="js/routing.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/route-weather.js"></script>
  <script src="js/eta.js"></script>
  <script src="js/radar.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
